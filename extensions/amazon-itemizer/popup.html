<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amazon Itemizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1>Amazon Itemizer</h1>
        <button id="openOptions" class="link-button" type="button">Settings</button>
      </header>

      <section class="card">
        <p id="statusText" class="status">Loading status...</p>
        <div class="meta-grid">
          <div>
            <span class="label">Install ID</span>
            <span id="installId" class="value">-</span>
          </div>
          <div>
            <span class="label">API</span>
            <span id="apiBaseUrl" class="value">-</span>
          </div>
          <div>
            <span class="label">Last Sync</span>
            <span id="lastSyncAt" class="value">Never</span>
          </div>
          <div>
            <span class="label">Orders Synced</span>
            <span id="lastSyncedOrders" class="value">0</span>
          </div>
        </div>
        <p id="lastError" class="error hidden"></p>
      </section>

      <div class="actions">
        <button id="syncNow" class="btn btn-primary" type="button">Sync Now</button>
        <button id="openOrders" class="btn" type="button">Open Amazon Orders</button>
        <button id="openIntake" class="btn" type="button">Open Intake</button>
      </div>

      <p class="sync-note">
        Sync opens a temporary background Amazon Orders tab, scans pages, then closes that tab automatically.
      </p>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
